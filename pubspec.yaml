name: pageflow_reader
description: Offline Android PDF, Office, text and image reader.
publish_to: none
version: 1.0.9+16

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  offline_document_viewer:
    path: third_party/offline_document_viewer
  cupertino_icons: ^1.0.8
  file: ^7.0.1
  file_picker: ^13.1.0
  flutter_pdf_annotations: ^1.3.0
  ffi: ^2.2.0
  image: ^4.10.1
  open_xml: ^0.3.1
  pdfrx: ^2.6.5
  pdfium_dart: ^0.3.1
  path_provider: ^2.1.6
  pdf: 3.12.0
  pdf_text_shaper: 1.1.0
  xml: ^6.6.1
  crypto: ^3.0.7
  archive: ^4.0.7
  tesseract_ocr: ^0.5.0
  printing: ^5.14.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  pdf_text_shaper:
    path: third_party/pdf_text_shaper
  harfbuzz_ffi:
    path: third_party/harfbuzz_ffi
  tesseract_ocr:
    path: third_party/tesseract_ocr

flutter:
  uses-material-design: true
  fonts:
    - family: Pageflow UI
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
  assets:
    - assets/licenses/THIRD_PARTY_NOTICES.txt
    - assets/tessdata_config.json
    - assets/tessdata/
    - assets/fonts/
